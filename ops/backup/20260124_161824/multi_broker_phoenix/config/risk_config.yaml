max_concurrent_trades: 4
max_total_open_risk_pct: 0.05
default_risk_per_trade_pct: 0.0075
pnl_brakes:
  daily_loss_limit_pct: -3.0
  weekly_loss_limit_pct: -8.0
drawdown_ladder:
  - name: NORMAL
    dd_min: 0.0
    dd_max: 0.10
    base_risk_per_trade_pct: 0.0075
    max_open_risk_pct: 0.05
    max_trades_per_platform: 3
    allow_new_trades: true
    triage_mode: false
  - name: TRIAGE
    dd_min: 0.10
    dd_max: 0.30
    base_risk_per_trade_pct: 0.0035
    max_open_risk_pct: 0.03
    max_trades_per_platform: 2
    allow_new_trades: true
    triage_mode: true
  - name: HALTED
    dd_min: 0.30
    dd_max: 1.0
    base_risk_per_trade_pct: 0.0
    max_open_risk_pct: 0.0
    max_trades_per_platform: 0
    allow_new_trades: false
    triage_mode: true
regime_risk_multipliers:
  BULL: { LOW: 1.0, NORMAL: 1.0, HIGH: 0.75, EXTREME: 0.0 }
  BEAR: { LOW: 1.0, NORMAL: 1.0, HIGH: 0.75, EXTREME: 0.0 }
  RANGE: { LOW: 0.75, NORMAL: 0.75, HIGH: 0.5, EXTREME: 0.0 }
triage_allowed_strategies:
  - institutional_sd
  - ema_scalper
  - trap_reversal
  - holy_grail
